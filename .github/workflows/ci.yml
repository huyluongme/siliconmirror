name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.cc }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        # ci: debug build with sanitizers. ci-release: optimized build,
        # where assert() is compiled out.
        preset: [ci, ci-release]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        run: make PRESET=${{ matrix.preset }} test

  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same version as the one used locally, so results match.
      - name: Install clang-format
        run: pipx install clang-format==21.1.8
      - name: Check formatting
        run: make check-format
